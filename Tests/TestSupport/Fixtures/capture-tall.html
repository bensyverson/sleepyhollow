<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capture fixture: tall page</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body { height: 3000px; background: #ffffff; }
    #target {
      position: absolute;
      top: 2400px;
      left: 100px;
      width: 200px;
      height: 150px;
      background: #ff3366;
    }
  </style>
</head>
<body>
  <p id="above-fold">Visible without scrolling.</p>
  <div id="target"></div>
</body>
</html>
