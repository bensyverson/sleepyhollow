<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overflow fixture (legitimate scroll container)</title>
  <style>
    body { margin: 0; }
    #scroller { overflow-x: auto; max-width: 100%; }
    table { border-collapse: collapse; width: 2400px; }
    td { width: 120px; border: 1px solid #262626; }
  </style>
</head>
<body>
  <h1>Wide table inside its own scroller</h1>
  <div id="scroller">
    <table id="wide-table">
      <tbody>
        <tr>
          <td>one</td><td>two</td><td>three</td><td>four</td><td>five</td>
          <td>six</td><td>seven</td><td>eight</td><td>nine</td><td>ten</td>
          <td>eleven</td><td>twelve</td><td>thirteen</td><td>fourteen</td>
          <td>fifteen</td><td>sixteen</td><td>seventeen</td><td>eighteen</td>
          <td>nineteen</td><td>twenty</td>
        </tr>
      </tbody>
    </table>
  </div>
  <p id="settled">Everything else fits the viewport.</p>
</body>
</html>
