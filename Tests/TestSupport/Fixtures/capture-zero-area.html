<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capture fixture: elements with no rendered area</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: #ffffff; font: 16px/24px system-ui, sans-serif; }
    #hidden { display: none; width: 200px; height: 150px; }
    #visible { width: 200px; height: 150px; background: #3366ff; }
  </style>
</head>
<body>
  <div id="hidden">Never laid out.</div>
  <p><span id="empty-inline"></span></p>
  <div id="visible"></div>
</body>
</html>
