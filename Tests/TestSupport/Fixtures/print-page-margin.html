<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Print pagination with a @page margin</title>
    <style>
      @page {
        margin: 1.25in;
      }
      body {
        font: 16px/1.5 Helvetica, Arial, sans-serif;
        margin: 0;
      }
      .block {
        height: 220px;
        margin: 0 0 20px;
      }
    </style>
  </head>
  <body>
    <p class="block">Margined body paragraph 1.</p>
    <p class="block">Margined body paragraph 2.</p>
    <p class="block">Margined body paragraph 3.</p>
    <p class="block">Margined body paragraph 4.</p>
    <p class="block">Margined body paragraph 5.</p>
    <p class="block">Margined body paragraph 6.</p>
    <p class="block">Margined body paragraph 7.</p>
    <p class="block">Margined body paragraph 8.</p>
  </body>
</html>
