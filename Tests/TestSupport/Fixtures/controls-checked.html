<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A checked checkbox</title>
  <!-- One large, checked, unfocused appearance:auto checkbox. In an active
       window AppKit fills it with the accent color, so its hue says which
       accent the web content process drew with. Shoot #box. -->
  <style>
    body { margin: 0; padding: 20px; background: #fff; }
    #box { width: 40px; height: 40px; margin: 0; }
  </style>
</head>
<body>
  <input id="box" type="checkbox" checked>
</body>
</html>
