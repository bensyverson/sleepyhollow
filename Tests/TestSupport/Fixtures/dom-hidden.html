<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hidden elements fixture</title>
  <style>
    .zero { width: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <h1>Hidden elements fixture</h1>
  <p id="visible">I am rendered and visible.</p>
  <p id="display-none" style="display: none;">I am display none.</p>
  <p id="visibility-hidden" style="visibility: hidden;">I am visibility hidden.</p>
  <p id="opacity-zero" style="opacity: 0;">I am opacity zero.</p>
  <p id="zero-size" class="zero">I am zero size.</p>
</body>
</html>
